[project]
name = "test-api-live"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "websockets>=17.2",
]

[dependency-groups]
server = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "weasyprint>=70",
    "websockets>=17.2",
]

[tool.uv]
default-groups = ["server"]  # uv run uvicorn server:app works out of the box
